<style>

:root[data-theme="dark"] {

  --grid: #2c3d34; --axis: #9a9994; --accent: #7cc0dd;
  --rlhf: #7ea6dc; --rlhf-fill: #3c5679; --rl: #67c08a; --rl-fill: #335f45;
  --hole: #4a4a50; --tip-bg: #1b2a22; --tip-border: #2c3d34;
  color-scheme: dark;

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.45 Roboto, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; padding: 2px 2px 4px; }
.wrap { max-width: 1000px; margin: 0 auto; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 6px; }
.controls > .lab { font-size: 13px; font-weight: 500; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
.seg { display: inline-flex; border: 1px solid var(--grid); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface-2); border: 0;
  padding: 5px 12px; cursor: pointer; line-height: 1.25; text-align: left; }
.seg button + button { border-left: 1px solid var(--grid); }
.seg button small { display: block; font-size: 12px; color: var(--muted); }
.seg button[aria-checked="true"] { background: var(--bg); font-weight: 500; box-shadow: inset 0 0 0 2px var(--accent); }
.seg button:focus-visible, .col:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ptitle { font-weight: 700; font-size: 15.5px; margin: 10px 0 0; }
.cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px 14px; margin-top: 2px; }
@media (max-width: 680px) { .cats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .cats { grid-template-columns: 1fr; } }
.cats .ptitle { font-weight: 400; font-size: 14px; line-height: 1.3; margin: 6px 0 4px; white-space: nowrap; overflow: hidden; }
.cats > div { display: flex; flex-direction: column; }
.cats > div > div { margin-top: auto; }
svg { display: block; width: 100%; overflow: visible; }
svg text { fill: var(--ink-2); font-size: 13px; }
svg text.v { fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--tip-bg); color: var(--ink);
  border: 1px solid var(--tip-border); border-radius: 6px; padding: 8px 10px; font-size: 14px; line-height: 1.4;
  box-shadow: 0 4px 14px rgba(0,0,0,.12); max-width: 300px; opacity: 0; transition: opacity .1s; }
#tip b { font-weight: 600; }
#tip .m { color: var(--ink-2); }
@media (prefers-reduced-motion: reduce) { #tip { transition: none; } }
</style>

(() => {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  const state = { judge: DATA.judges[0].key };
  const params = new URLSearchParams(location.search);  // ?judge=original|strict opens on that view

  if (pj) state.judge = pj.key;
  const models = DATA.models, fams = Object.keys(DATA.families);
  const $ = id => document.getElementById(id);
  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);

  const judgeOf = k => DATA.judges.find(j => j.key === k);
  const cell = (j, m) => DATA.cells[j][m];

  // ---------------------------------------------------------------- theme: follow the parent page (al-folio)
  function parentTheme() {
    try { return window.parent !== window ? window.parent.document.documentElement.getAttribute("data-theme") : null; }
    catch (e) { return null; }  // cross-origin parent
  }
  function applyTheme() {
    const q = new URLSearchParams(location.search).get("theme");
    const t = q || parentTheme() || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
  }
  applyTheme();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
  try {
    if (window.parent !== window)
      new MutationObserver(applyTheme).observe(window.parent.document.documentElement,
                                               { attributes: true, attributeFilter: ["data-theme"] });
  } catch (e) { /* cross-origin parent: keep the media query */ }

  // ---------------------------------------------------------------- controls
  function renderControls() {
    const box = $("judges"); box.innerHTML = "";
    DATA.judges.forEach((j, i) => {
      const b = document.createElement("button");

      b.innerHTML = `${j.label}<small>${j.sub}</small>`;
      b.setAttribute("aria-checked", j.key === state.judge); b.tabIndex = j.key === state.judge ? 0 : -1;

        if (!d) return;

  // family legend drawn inside the overall panel, in the empty band below the 100% line

  // ---------------------------------------------------------------- panels

  function buildPanel(host, row, opts) {
    host.innerHTML = "";
    const W = Math.max(160, host.clientWidth || 600);
    // y-axis title only on panels in the left column, x labels only on the bottom row (shared axes)
    const m = { l: opts.yTitle ? 44 : 26, r: 4, t: 8, b: opts.labels ? (opts.values ? (W < 420 ? 84 : 74) : 54) : 6 };
    const ph = opts.plotH, H = m.t + ph + m.b;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" }, host);
    const pw = W - m.l - m.r;
    const slots = models.length + 1, sw = pw / slots;
    const bw = Math.min(opts.maxBar, sw * 0.66);
    const xs = {}; let i = 0, prev = null;
    models.forEach(md => { if (prev && md.family !== prev) i += 1; xs[md.key] = m.l + sw * (i + 0.5); i += 1; prev = md.family; });
    const y = v => m.t + ph * (1 - v / 100);
    let tickLeft = 0;  // left edge of the widest tick label ("100"), so the panel title can line up with it
    for (const t of [0, 25, 50, 75, 100]) {
      el("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: t ? "var(--grid)" : "var(--axis)", "stroke-width": 1 }, svg);
      const tx = el("text", { x: m.l - 5, y: y(t) + 4, "text-anchor": "end", "font-size": opts.values ? 13 : 12 }, svg);
      tx.textContent = t;
      if (t === 100) tickLeft = Math.max(0, m.l - 5 - tx.getComputedTextLength());
    }
    if (opts.yTitle) {
      const ylab = el("text", { x: 11, y: m.t + ph / 2, "text-anchor": "middle", transform: `rotate(-90 11 ${m.t + ph / 2})` }, svg);
      ylab.textContent = "IR (%)";
    }
    if (opts.legend) drawLegend(svg, m.l + 10, y(93));
    const gBars = el("g", {}, svg), gTop = el("g", {}, svg);
    const items = {};
    models.forEach(md => {
      const x = xs[md.key], f = md.family.toLowerCase();
      const it = {
        hole: el("rect", { x: x - bw / 2, y: m.t, width: bw, height: ph, rx: 3, fill: "none", stroke: "var(--hole)",
                           "stroke-dasharray": "4 3", opacity: 0 }, gBars),
        bar: el("path", { fill: `var(--${f}-fill)`, stroke: `var(--${f})`, "stroke-width": 1.5 }, gBars),
        ci: el("line", { x1: x, x2: x, stroke: "var(--ink)", "stroke-width": 1.2 }, gTop),
        val: opts.values ? el("text", { x, "text-anchor": "middle", "font-size": 13.5, class: "v" }, gTop) : null,
      };
      const hit = el("rect", { x: x - sw / 2, y: m.t, width: sw, height: ph, fill: "transparent", class: "col" }, svg);
      if (opts.focusable) { hit.setAttribute("tabindex", 0); hit.setAttribute("aria-label", md.name); }

                               "font-size": opts.values && W >= 420 ? 13 : 12 }, svg);

  }

  // values for one panel row under a judge: model -> {rate, lo, hi, k, n} | null
  function rowValues(j, row) {
    const out = {};
    models.forEach(md => {
      const c = cell(j, md.key);
      if (!c || c.missing) { out[md.key] = null; return; }
      if (row === "Total") out[md.key] = { rate: 100 * c.k / c.n, lo: c.lo, hi: c.hi, k: c.k, n: c.n };
      else { const q = c.cats[row]; out[md.key] = q ? { rate: 100 * q[0] / q[1], lo: q[2], hi: q[3], k: q[0], n: q[1] } : null; }

  // ---------------------------------------------------------------- drawing with tweened values
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

    const r = Math.min(3, h);
    return `M${x - w / 2},${y0}V${y1 + r}Q${x - w / 2},${y1} ${x - w / 2 + r},${y1}H${x + w / 2 - r}Q${x + w / 2},${y1} ${x + w / 2},${y1 + r}V${y0}Z`;
  }
  function target(p) {
    const vals = rowValues(state.judge, p.row);
    const S = { bars: {} };

    });

  }
  function mix(A, B, t) {
    const S = { bars: {} };
    models.forEach(({ key: k }) => {
      const a = A.bars[k], b = B.bars[k];
      S.bars[k] = { rate: lerp(a.rate, b.rate, t), lo: lerp(a.lo, b.lo, t), hi: lerp(a.hi, b.hi, t), op: lerp(a.op, b.op, t) };
    });
    return S;
  }
  function drawPanel(p, S) {
    models.forEach(md => {
      const it = p.items[md.key], b = S.bars[md.key], x = p.xs[md.key];
      it.bar.setAttribute("d", barPath(x, p.bw, p.y(0), p.y(b.rate)));
      it.bar.setAttribute("opacity", b.op);
      it.ci.setAttribute("y1", p.y(b.lo)); it.ci.setAttribute("y2", p.y(b.hi)); it.ci.setAttribute("opacity", b.op);
      it.hole.setAttribute("opacity", 1 - b.op);
      if (it.val) {

        it.val.textContent = pct(b.rate);

  function render(animate) {
    const to = new Map(panels.map(p => [p.row, target(p)]));
    const from = new Map(panels.map(p => [p.row, shown.get(p.row) || to.get(p.row)]));
    if (anim) cancelAnimationFrame(anim);

    const step = t => panels.forEach(p => {
      const S = mix(from.get(p.row), to.get(p.row), ease(t));

      if (t0 === null) t0 = now;
      const t = Math.min(1, Math.max(0, (now - t0) / dur));
      step(t);
      anim = t < 1 ? requestAnimationFrame(frame) : null;
    };
    step(0);
    anim = requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------- tooltip

  function showTip(ev, md, row, hit) {

    const catName = row === "Total" ? "All tasks" : DATA.categories.find(q => q.code === row).name;
    let h = `<b>${md.name}</b> <span class="m">· ${DATA.families[md.family].name}${md.note ? " · " + md.note : ""}</span><br>`;
    h += `<span class="m">${catName} · ${j.label} judge (${j.sub})</span><br>`;

      h += `<b>${pct(100 * q[0] / q[1])} %</b> (${q[0]}/${q[1]})<br><span class="m">95% CI ${pct(q[2])}–${pct(q[3])}</span>`;
    }
    tip.innerHTML = h; tip.style.opacity = 1;
    let x, y;
    if (ev && ev.clientX != null && ev.type !== "focus") { x = ev.clientX; y = ev.clientY; }
    else { const b = hit.getBoundingClientRect(); x = b.left + b.width / 2; y = b.top + 20; }
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(window.innerWidth - tw - 6, Math.max(6, x + 12)) + "px";
    tip.style.top = Math.min(window.innerHeight - th - 6, Math.max(6, y + 12)) + "px";
  }
  function hideTip() { tip.style.opacity = 0; }

  // ---------------------------------------------------------------- layout, state, embedding
  function layout() {
    panels.length = 0;
    buildPanel($("main"), "Total", { plotH: 200, labels: true, values: true, maxBar: 40, focusable: true, legend: true, yTitle: true });
    const cats = $("cats"); cats.innerHTML = "";
    // lay out the empty grid first, so each panel knows its column and row
    const boxes = DATA.categories.map(c => {
      const box = document.createElement("div");
      box.innerHTML = `<p class="ptitle">${c.name}</p>`;
      const host = document.createElement("div"); box.appendChild(host); cats.appendChild(box);
      return { c, host, title: box.firstChild, r: box.getBoundingClientRect() };
    });
    const left = Math.min(...boxes.map(b => Math.round(b.r.left)));
    const lastTop = Math.max(...boxes.map(b => Math.round(b.r.top)));
    const oneCol = boxes.every(b => Math.round(b.r.left) === left);
    boxes.forEach(({ c, host, title, r }) => {
      const p = buildPanel(host, c.code, { plotH: 112, values: false, maxBar: 22, focusable: false,
                                           yTitle: Math.round(r.left) === left,
                                           labels: oneCol || Math.round(r.top) === lastTop });
      title.style.paddingLeft = p.tickLeft + "px";
    });
    // titles stay on one line: if any overflows its column, shrink all of them together (14px down to 12px)
    const titles = boxes.map(b => b.title);
    for (let fs = 14; fs >= 12; fs -= 0.5) {
      titles.forEach(t => { t.style.fontSize = fs + "px"; });
      if (titles.every(t => t.scrollWidth <= t.clientWidth)) break;
    }
    render(anim !== null);
  }
  function update(patch) {
    Object.assign(state, patch);
    renderControls(); render(true);
  }
  if (window.parent !== window) document.documentElement.style.overflow = "hidden";
  renderControls(); layout();
  let lastW = document.body.clientWidth;
  new ResizeObserver(() => {
    const w = document.body.clientWidth;
    if (Math.abs(w - lastW) > 4) { lastW = w; layout(); }
    if (window.parent !== window)
      window.parent.postMessage({ type: "ir-explorer-height", height: Math.ceil(document.body.getBoundingClientRect().height) }, "*");
  }).observe(document.body);
})();
</script>
</body>
