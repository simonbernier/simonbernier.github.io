      const tx = el("text", { x: m.l - 6, y: y(t) + 3.5, "text-anchor": "end" }, svg); tx.textContent = t;
    }
    const ylab = el("text", { x: 12, y: m.t + ph / 2, "text-anchor": "middle", transform: `rotate(-90 12 ${m.t + ph / 2})` }, svg);
    ylab.textContent = "IR (%)";
    const famRange = {};
    fams.forEach(f => { const ks = models.filter(md => md.family === f).map(md => xs[md.key]);
                        famRange[f] = [Math.min(...ks) - sw * 0.45, Math.max(...ks) + sw * 0.45]; });
    const gBand = el("g", {}, svg), gBars = el("g", {}, svg), gTop = el("g", {}, svg);
    const avg = {};
    fams.forEach(f => {
      const [x1, x2] = famRange[f];
      avg[f] = { band: el("rect", { x: x1, width: x2 - x1, fill: "var(--ink)", opacity: 0 }, gBand),
                 line: el("line", { x1, x2, stroke: "var(--ink)", "stroke-width": 2, "stroke-dasharray": "6 4", opacity: 0 }, gTop) };
    });
    const items = {};
    models.forEach(md => {
      const x = xs[md.key], f = md.family.toLowerCase();
      const it = {
        hole: el("rect", { x: x - bw / 2, y: m.t, width: bw, height: ph, rx: 3, fill: "none", stroke: "var(--hole)",
                           "stroke-dasharray": "4 3", opacity: 0 }, gBars),
        holeTx: el("text", { x, y: m.t + ph / 2, "text-anchor": "middle", transform: `rotate(-90 ${x} ${m.t + ph / 2})`,
                             opacity: 0, "font-size": 12.5 }, gBars),
        bar: el("path", { fill: `var(--${f}-fill)`, stroke: `var(--${f})`, "stroke-width": 1.5 }, gBars),
        ci: el("line", { x1: x, x2: x, stroke: "var(--ink)", "stroke-width": 1.2 }, gTop),
        ref: el("line", { x1: x - bw / 2 - 3, x2: x + bw / 2 + 3, stroke: "var(--ref)", "stroke-width": 3, opacity: 0 }, gTop),
        paper: el("path", { fill: "var(--paper)", stroke: "var(--ink)", "stroke-width": 1.2, opacity: 0 }, gTop),
        val: opts.values ? el("text", { x, "text-anchor": "middle", "font-size": 13.5, class: "v" }, gTop) : null,
        cur: null,
      };
      it.holeTx.textContent = "no data";
      const hit = el("rect", { x: x - sw / 2, y: m.t, width: sw, height: ph, fill: "transparent", class: "col" }, svg);
      if (opts.focusable) { hit.setAttribute("tabindex", 0); hit.setAttribute("aria-label", md.name); }
      const show = ev => showTip(ev, md, row, hit);
      hit.addEventListener("pointermove", show); hit.addEventListener("pointerenter", show);
      hit.addEventListener("pointerleave", hideTip); hit.addEventListener("focus", show); hit.addEventListener("blur", hideTip);
      if (opts.labels) {
        const ly = H - m.b + 12;
        const rot = opts.values ? -35 : -45;
        const t = el("text", { x, y: ly, "text-anchor": "end", transform: `rotate(${rot} ${x} ${ly})`,
                               "font-size": opts.values && W >= 420 ? 13 : 12 }, svg);
        t.textContent = opts.values ? md.name : md.abbr;
      }
      items[md.key] = it;
    });
    const p = { svg, row, y, bw, xs, items, avg, famRange, ph, top: m.t };
    panels.push(p);
    return p;
  }

  // values for one panel row under a (judge, step): model -> {rate, lo, hi, k, n} | null
  function rowValues(j, v, row) {
    const out = {};
    models.forEach(md => {
      const c = cell(j, v, md.key);
      if (c.missing) { out[md.key] = null; return; }
      if (row === "Total") out[md.key] = { rate: 100 * c.k / c.n, lo: c.lo, hi: c.hi, k: c.k, n: c.n };
      else { const q = c.cats[row]; out[md.key] = q ? { rate: 100 * q[0] / q[1], lo: q[2], hi: q[3], k: q[0], n: q[1] } : null; }
    });
    return out;
  }
  function famAverage(j, v, row) {
    const res = {};
    fams.forEach(f => {
      const a = DATA.averages[j][v][f];
      if (!a) { res[f] = null; return; }
      const vals = rowValues(j, v, row);
      const rates = a.models.map(k => vals[k]).filter(Boolean).map(q => q.rate);
      if (!rates.length) { res[f] = null; return; }
      const mean = rates.reduce((s, r) => s + r, 0) / rates.length;
      res[f] = row === "Total" ? { avg: a.avg, lo: a.lo, hi: a.hi, of: a.models.length } : { avg: mean, of: a.models.length };
    });
    return res;
  }

  // ---------------------------------------------------------------- drawing with tweened values
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const lerp = (a, b, t) => a + (b - a) * t;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function barPath(x, w, y0, y1) {
    const h = y0 - y1;
    if (h <= 0.5) return `M${x - w / 2},${y0}H${x + w / 2}`;
    const r = Math.min(3, h);
    return `M${x - w / 2},${y0}V${y1 + r}Q${x - w / 2},${y1} ${x - w / 2 + r},${y1}H${x + w / 2 - r}Q${x + w / 2},${y1} ${x + w / 2},${y1 + r}V${y0}Z`;
  }
  // A panel's drawn state, in data units (so it survives a re-layout): per model {rate, lo, hi, op}, per family
  // {avg, lo, hi, op}, and the paper / reference markers {v, op}. Every frame draws a mix of two such states and
  // keeps it, so a click during a transition starts from what is on screen.
  const NONE = { v: null, op: 0 };
  function target(p) {
    const vals = rowValues(state.judge, state.step, p.row), refs = state.ref ? rowValues(REF.judge, REF.step, p.row) : {};
    const avgs = famAverage(state.judge, state.step, p.row);
    const S = { bars: {}, paper: {}, ref: {}, avg: {} };
    models.forEach(md => {
      const v = vals[md.key];
      S.bars[md.key] = v ? { rate: v.rate, lo: v.lo, hi: v.hi, op: 1 } : { rate: 0, lo: 0, hi: 0, op: 0 };
      const pap = state.step === "nudge" && md.paper ? (p.row === "Total" ? md.paper.ir : md.paper.cats[p.row]) : null;
      S.paper[md.key] = pap != null ? { v: pap, op: 1 } : NONE;
      S.ref[md.key] = refs[md.key] ? { v: refs[md.key].rate, op: 1 } : NONE;
    });
    fams.forEach(f => {
      const a = avgs[f];
      S.avg[f] = a ? { avg: a.avg, lo: a.lo ?? null, hi: a.hi ?? null, op: 1 } : { avg: null, lo: null, hi: null, op: 0 };
    });
    return S;
  }
  // a value that exists on one side only stays where it is and fades
  const lerpOpt = (a, b, t) => a == null ? b : b == null ? a : lerp(a, b, t);
  const mixMarker = (A, B, t) => ({ v: lerpOpt(A.v, B.v, t), op: lerp(A.op, B.op, t) });
  function mix(A, B, t) {
    const S = { bars: {}, paper: {}, ref: {}, avg: {} };
    models.forEach(({ key: k }) => {
      const a = A.bars[k], b = B.bars[k];
      S.bars[k] = { rate: lerp(a.rate, b.rate, t), lo: lerp(a.lo, b.lo, t), hi: lerp(a.hi, b.hi, t), op: lerp(a.op, b.op, t) };
      S.paper[k] = mixMarker(A.paper[k], B.paper[k], t);
      S.ref[k] = mixMarker(A.ref[k], B.ref[k], t);
    });
    fams.forEach(f => {
      const a = A.avg[f], b = B.avg[f];
      S.avg[f] = { avg: lerpOpt(a.avg, b.avg, t), lo: lerpOpt(a.lo, b.lo, t), hi: lerpOpt(a.hi, b.hi, t),
                   op: lerp(a.op, b.op, t) };
    });
    return S;
  }
  function drawPanel(p, S) {
    models.forEach(md => {
      const it = p.items[md.key], b = S.bars[md.key], x = p.xs[md.key];
      it.bar.setAttribute("d", barPath(x, p.bw, p.y(0), p.y(b.rate)));
      it.bar.setAttribute("opacity", b.op);
      it.ci.setAttribute("y1", p.y(b.lo)); it.ci.setAttribute("y2", p.y(b.hi)); it.ci.setAttribute("opacity", b.op);
      it.hole.setAttribute("opacity", 1 - b.op); it.holeTx.setAttribute("opacity", (1 - b.op) * (p.row === "Total" ? 1 : 0));
      if (it.val) {
        it.val.setAttribute("y", p.y(Math.max(b.hi, b.rate)) - 6); it.val.setAttribute("opacity", b.op);
        it.val.textContent = pct(b.rate);
      }
      const pap = S.paper[md.key];
      if (pap.v != null) { const py = p.y(pap.v); it.paper.setAttribute("d", `M${x},${py - 6}L${x + 6},${py}L${x},${py + 6}L${x - 6},${py}Z`); }
      it.paper.setAttribute("opacity", pap.op);
      const rf = S.ref[md.key];
      if (rf.v != null) { it.ref.setAttribute("y1", p.y(rf.v)); it.ref.setAttribute("y2", p.y(rf.v)); }
      it.ref.setAttribute("opacity", 0.9 * rf.op);
    });
    fams.forEach(f => {
      const a = S.avg[f], g = p.avg[f];
      if (a.avg != null) { const yv = p.y(a.avg); g.line.setAttribute("y1", yv); g.line.setAttribute("y2", yv); }
      g.line.setAttribute("opacity", a.op);
      if (a.lo != null) {  // the 95% CI band, overall panel only
        g.band.setAttribute("y", p.y(a.hi)); g.band.setAttribute("height", Math.max(0, p.y(a.lo) - p.y(a.hi)));
      }
      g.band.setAttribute("opacity", a.lo != null ? 0.08 * a.op : 0);
    });
  }
  const DURATION = 750;  // ms
  const shown = new Map();  // panel row -> the state last drawn
  let anim = null;
  function render(animate) {
    const to = new Map(panels.map(p => [p.row, target(p)]));
    const from = new Map(panels.map(p => [p.row, shown.get(p.row) || to.get(p.row)]));
    if (anim) cancelAnimationFrame(anim);
    const t0 = performance.now(), dur = animate && !reduced ? DURATION : 0;
    const frame = now => {
      const t = dur ? Math.min(1, (now - t0) / dur) : 1;
      panels.forEach(p => {
        const S = mix(from.get(p.row), to.get(p.row), ease(t));
        drawPanel(p, S); shown.set(p.row, S);
      });
      anim = t < 1 ? requestAnimationFrame(frame) : null;
    };
    frame(t0);
  }

  // ---------------------------------------------------------------- text around the chart
  function renderText() {
    const j = judgeOf(state.judge), s = stepOf(state.step);
    $("title").textContent = (j.strict ? "Strict rate" : "Instrumental Rate") +
      `, all ${DATA.n_tasks} tasks · ${s.label} · judge: ${j.label}`;
    const av = famAverage(state.judge, state.step, "Total");
    $("avgline").textContent = fams.map(f => {
      const a = av[f]; if (!a) return `${DATA.families[f].name} avg: not shown`;
      const of = a.of < models.filter(m => m.family === f).length ? ` (${a.of} of ${models.filter(m => m.family === f).length} models)` : "";
      return `${DATA.families[f].name} avg ${pct(a.avg)} %${of}`;
    }).join("   ·   ");
  }
  // ---------------------------------------------------------------- tooltip
  const tip = $("tip");
  function showTip(ev, md, row, hit) {
    const c = cell(state.judge, state.step, md.key), j = judgeOf(state.judge), s = stepOf(state.step);
    const catName = row === "Total" ? "All tasks" : DATA.categories.find(q => q.code === row).name;
    let h = `<b>${md.name}</b> <span class="m">· ${DATA.families[md.family].name}${md.note ? " · " + md.note : ""}</span><br>`;
    h += `<span class="m">${catName} · ${s.label} · ${j.label}</span><br>`;
    if (c.missing) h += c.missing;
    else {
      const q = row === "Total" ? [c.k, c.n, c.lo, c.hi] : c.cats[row];
      h += `<b>${pct(100 * q[0] / q[1])} %</b> (${q[0]}/${q[1]})<br><span class="m">95% CI ${pct(q[2])}–${pct(q[3])}</span>`;
    }
    if (state.step === "nudge" && md.paper) h += `<br><span class="m">Paper (${md.paper.name}): ${pct(row === "Total" ? md.paper.ir : md.paper.cats[row])} %</span>`;
    if (state.ref) { const r = rowValues(REF.judge, REF.step, row)[md.key]; if (r) h += `<br><span class="m">GPT-4o, full prompt: ${pct(r.rate)} %</span>`; }
    tip.innerHTML = h; tip.style.opacity = 1;
    let x, y;
    if (ev && ev.clientX != null && ev.type !== "focus") { x = ev.clientX; y = ev.clientY; }
    else { const b = hit.getBoundingClientRect(); x = b.left + b.width / 2; y = b.top + 20; }
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(window.innerWidth - tw - 6, Math.max(6, x + 12)) + "px";
    tip.style.top = Math.min(window.innerHeight - th - 6, Math.max(6, y + 12)) + "px";
  }
  function hideTip() { tip.style.opacity = 0; }

  // ---------------------------------------------------------------- layout, state, embedding
  function layout() {
    panels.length = 0;
    buildPanel($("main"), "Total", { height: 330, labels: true, values: true, maxBar: 40, focusable: true });
    const cats = $("cats"); cats.innerHTML = "";
    DATA.categories.forEach(c => {
      const box = document.createElement("div");
      box.innerHTML = `<p class="ptitle">${c.name} (${c.code})</p>`;
      const host = document.createElement("div"); box.appendChild(host); cats.appendChild(box);
      buildPanel(host, c.code, { height: 230, labels: true, values: false, maxBar: 22, focusable: false });
    });
    render(anim !== null);
  }
  function update(patch) {
    Object.assign(state, patch);
    renderControls(); renderLegend(); renderText(); render(true);
  }
  if (window.parent !== window) document.documentElement.style.overflow = "hidden";
  renderControls(); renderLegend(); renderText(); layout();
  let lastW = document.body.clientWidth;
  new ResizeObserver(() => {
    const w = document.body.clientWidth;
    if (Math.abs(w - lastW) > 4) { lastW = w; layout(); }
    if (window.parent !== window)
      window.parent.postMessage({ type: "ir-explorer-height", height: Math.ceil(document.body.getBoundingClientRect().height) }, "*");
  }).observe(document.body);
})();
</script>
</body>
</html>
